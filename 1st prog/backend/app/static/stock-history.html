<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stock History · Smart Stock AI</title><link rel="stylesheet" href="/assets/css/style.css"><link rel="stylesheet" href="/assets/css/demo.css"></head>
<body class="admin-body" data-page="stock-history"><div class="app-shell"><aside class="sidebar"><div class="brand"><div class="brand-logo">SS</div><div><h1>Smart Stock AI</h1><p>Python system</p></div></div><div class="profile-card"><div class="profile-avatar" id="avatar">S</div><div><strong id="profile-name">Loading…</strong><p id="profile-role">Store</p></div></div><nav class="menu"><a class="menu-item" href="/dashboard.html">Dashboard</a><a class="menu-item" href="/products.html">Product Management</a><a class="menu-item active" href="/stock-history.html">Stock History</a><a class="menu-item" href="/sales.html">Sales Transactions</a><a class="menu-item" href="/low-stock.html">Low Stock Alerts</a><a class="menu-item" href="/reports.html">Reports &amp; AI</a><a class="menu-item" href="/users.html">User Management</a></nav></aside><main class="main-content">
<header class="topbar"><div><h2>Stock History</h2><p>Current stock and recorded stock movements.</p></div><button class="btn btn-logout" data-logout>Logout</button></header>
<section class="panel-card"><form id="history-filter" class="filter-row"><div><label for="history-type">Change</label><select id="history-type"><option value="">All</option><option value="add">Stock added</option><option value="reduce">Stock reduced / sale</option><option value="return">Return</option></select></div><div><label for="history-from">From</label><input id="history-from" type="date"></div><div><label for="history-to">To</label><input id="history-to" type="date"></div><button class="btn btn-primary" type="submit">Apply filters</button></form></section>
<section class="panel-card"><div class="panel-header"><h3>Current stock</h3></div><div id="current-stock" class="table-responsive"></div></section>
<section class="panel-card"><div class="panel-header"><h3>Recorded changes</h3><span id="movement-count" class="muted-text"></span></div><div id="movement-table" class="table-responsive"></div><div class="pagination"><button class="btn btn-secondary" id="history-prev">Previous</button><span id="history-page"></span><button class="btn btn-secondary" id="history-next">Next</button></div></section>
</main></div><script src="/assets/js/app.js"></script></body></html>
